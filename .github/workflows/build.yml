# Compila Ping.exe su GitHub. Nessun cgo: si compila per Windows anche da Linux.
#  - a ogni push e pull request: build + test, l'exe si scarica da "Actions" › esecuzione › Artifacts
#  - con un tag tipo v1.2.0: l'exe viene allegato automaticamente a una Release
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # serve solo per creare le Release dai tag

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -short ./...

      - name: Icona e informazioni sul file (risorse Windows)
        run: go run github.com/tc-hib/go-winres@latest make --arch amd64,arm64

      - name: Compila Ping.exe (x64 e ARM64)
        env:
          GOOS: windows
          CGO_ENABLED: "0"
        run: |
          GOARCH=amd64 go build -trimpath -ldflags "-s -w -H windowsgui" -o dist/Ping.exe .
          GOARCH=arm64 go build -trimpath -ldflags "-s -w -H windowsgui" -o dist/Ping-arm64.exe .
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: Ping
          path: dist/*.exe

      - name: Pubblica la Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
